UQ[3]={"t": "iq", "time": 40, "lv": 5, "x": "次の図は、ある規則に従って並んでいます。「？」に入る段はどれですか？<br>□□□□□<br>□■□■□<br>□□□□□<br>？<br>□□□□□", "c": [["□■□■□", 1], ["□□□□□", 0], ["■□□□■", 0], ["□■■■□", "g"]]};UQ[4]={"t": "iq", "time": 40, "lv": 6, "x": "深夜、誰もいない部屋に、紙が1枚落ちていた。紙には「TFF NF」とだけ書かれている。<br>この文は、元の文のアルファベットを1文字ずつ後ろにずらして作られた暗号である。（例：CAT → DBU）<br>元の文として最も適当なものはどれか？", "c": [["SEE ME", 1], ["SEE YOU", "g"], ["TEA ME", 0], ["SEA ME", 0]]};UQ[6]={"t": "iq", "bo": 1, "time": 40, "lv": 4, "x": "深夜、自室で怪談サイトを閲覧していた男のPCが、前触れもなく急に電源が落ち、画面が真っ黒になった。<br>男：「うわっ……マジかよ、急に落ちた。なんで？」<br>この現象の原因として、最も適当なものはどれか？", "c": [["長時間の使用でPC内部（CPU）が熱を持ちすぎたため、故障を防ぐ安全機能が働いて自動でシャットダウンした。", 1], ["閲覧していた怪談サイトを通して、PC本体に直接「呪い」が伝達し、システムに不具合を引き起こした。", "g"], ["サイトの文章の「文字数」が多すぎたため、モニターが重量に耐えきれなくなって壊れた。", 0], ["部屋の空気が冷えたことで、コンセントの中を通る電気が凍りついて届かなくなった。", 0]]};UQ[7]={"t": "word", "time": 25, "x": "祖父母・両親・子ども2人の6人家族で、家族写真を撮ることになりました。しかし、祖父は先日、事故で亡くなってしまいました。写真に写っているはずの人数は？", "c": [["4人", 0], ["6人", "g"], ["5人", 1]]};UQ[7].fig=PH;
